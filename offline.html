<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d2d55">
  <title>OpenCompany – Offline</title>
  <style>
    :root{
      font-family:"Aptos Display","Aptos",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:#10233f;
      background:#f4f7fb;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
      background:#f4f7fb;
    }
    main{
      width:min(560px,100%);
      background:#fff;
      border:1px solid #d8e2ee;
      border-radius:18px;
      padding:32px;
      box-shadow:0 18px 50px rgba(13,45,85,.10);
      text-align:center;
    }
    .mark{
      width:64px;
      height:64px;
      margin:0 auto 18px;
      border-radius:16px;
      display:grid;
      place-items:center;
      background:#0d2d55;
      color:#fff;
      font-weight:800;
      font-size:22px;
      letter-spacing:.04em;
    }
    h1{margin:0 0 10px;font-size:28px}
    p{margin:0 0 22px;line-height:1.55;color:#617087}
    button{
      border:0;
      border-radius:10px;
      padding:12px 18px;
      background:#1769d2;
      color:#fff;
      font:inherit;
      font-weight:700;
      cursor:pointer;
    }
    button:hover{background:#125bb8}
  </style>
</head>
<body>
  <main>
    <img src="/icon-512.png" alt="OpenCompany Logo" style="width:min(200px,60vw);height:auto;display:block;margin:0 auto 18px;">
    <h1>OpenCompany ist offline</h1>
    <p>
      OpenCompany benötigt eine Internetverbindung, damit Spielstände,
      Markt-, Produktions- und Finanzdaten aktuell bleiben.
      Stelle die Verbindung wieder her und versuche es erneut.
    </p>
    <button type="button" onclick="window.location.reload()">Erneut versuchen</button>
  </main>
</body>
</html>
