name: Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build test APK
        working-directory: android
        run: gradle --no-daemon --stacktrace --info :app:assembleDebug
      - name: Android lint
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: OpenCompany-Android-Test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
