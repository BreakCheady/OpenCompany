name: Frontend quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and manifest validation
        run: |
          node --check app.js
          node --check guidance.js
          node --check management.js
          node --check service-worker.js
          node -e "const fs=require('fs'); JSON.parse(fs.readFileSync('manifest.webmanifest','utf8'));"
      - name: Regression tests
        run: |
          node tests/chat-unread.cjs
          node tests/progression.cjs
          node tests/progression-ui.cjs
          node tests/retail-target-time.cjs
          node tests/management-revenue-period.cjs
          node tests/weekly-management-report.cjs
          node tests/large-order-small-quantity.cjs
          node tests/npc-flour-price.cjs
          node tests/finance-ledger-history.cjs
          node tests/management-goals-active-only.cjs
          node tests/management-dashboard-layout.cjs
          node tests/unified-management-week.cjs
          node tests/large-order-compact-layout.cjs
          node tests/expanded-company-goals.cjs
          node tests/economy-cost-audit.cjs
          node tests/economy-job-ledger-audit.cjs
          node tests/economy-retail-zero-revenue-guard.cjs
          node tests/economy-expanded-price-sensitivity.cjs

          node tests/economy-live-retail-revenue-sim.cjs
          node tests/economy-deterministic-quality-system.cjs
          node tests/retail-complaints-management-story.cjs
          node tests/complaints-visual-impact.cjs
          node tests/complaints-deadline-display.cjs
          node tests/management-deadline-display.cjs
          node tests/management-manager-delta.cjs
          node tests/storage-zero-residue-visibility.cjs
          node tests/large-order-delivery-deadline.cjs
          node tests/large-order-card-hierarchy.cjs
          node tests/category-research-units-and-products.cjs
          node tests/market-category-research-catalog.cjs

          node tests/economy-npc-cost-plus-market-pricing.cjs
