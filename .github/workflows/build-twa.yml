name: Build OpenCompany TWA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "manifest.webmanifest"
      - "icon-192.png"
      - "icon-512.png"
      - "icon-maskable-512.png"
      - "service-worker.js"
      - "offline.html"
      - ".github/workflows/build-twa.yml"
      - ".github/scripts/configure-twa.mjs"

permissions:
  contents: read

jobs:
  build-twa:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TWA_DIR: twa-build
      TWA_PACKAGE_ID: com.opencompany.game
      TWA_APP_NAME: OpenCompany
      TWA_LAUNCHER_NAME: OpenCompany
      TWA_HOST: opencompanygame.com
      TWA_START_URL: /
      TWA_VERSION_NAME: 1.0.0
      TWA_VERSION_CODE: "1"
      TWA_ASSET_VERSION: 0.10.160
      BUBBLEWRAP_IMAGE: ghcr.io/googlechromelabs/bubblewrap:latest
      BUBBLEWRAP_VOLUME: opencompany-bubblewrap-home

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check live PWA manifest and icons
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST_URL="https://${TWA_HOST}/manifest.webmanifest?v=${TWA_ASSET_VERSION}"
          ICON_URL="https://${TWA_HOST}/icon-512.png?v=${TWA_ASSET_VERSION}"
          MASKABLE_URL="https://${TWA_HOST}/icon-maskable-512.png?v=${TWA_ASSET_VERSION}"
          curl --fail --silent --show-error --location "${MANIFEST_URL}" -o /tmp/manifest.webmanifest
          node -e "JSON.parse(require('fs').readFileSync('/tmp/manifest.webmanifest','utf8')); console.log('Live manifest JSON: OK')"
          curl --fail --silent --show-error --location --output /dev/null "${ICON_URL}"
          curl --fail --silent --show-error --location --output /dev/null "${MASKABLE_URL}"

      - name: Prepare TWA manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${TWA_DIR}" dist
          mkdir -p "${TWA_DIR}"
          node .github/scripts/configure-twa.mjs "${TWA_DIR}/twa-manifest.json"

      - name: Prepare persistent Bubblewrap SDK volume
        shell: bash
        run: |
          set -euo pipefail
          docker volume rm "${BUBBLEWRAP_VOLUME}" >/dev/null 2>&1 || true
          docker volume create "${BUBBLEWRAP_VOLUME}"

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -v "${BUBBLEWRAP_VOLUME}:/root/.bubblewrap" \
            -w "/work/${TWA_DIR}" \
            "${BUBBLEWRAP_IMAGE}" \
            update \
            --skipVersionUpgrade \
            --manifest="/work/${TWA_DIR}/twa-manifest.json"

      - name: Accept Android SDK licenses and install build packages
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint /bin/bash \
            -v "${GITHUB_WORKSPACE}:/work" \
            -v "${BUBBLEWRAP_VOLUME}:/root/.bubblewrap" \
            -w "/work/${TWA_DIR}" \
            "${BUBBLEWRAP_IMAGE}" \
            -lc '
              set -euo pipefail
              SDK_ROOT="/root/.bubblewrap/android_sdk"
              SDKMANAGER="$(find "${SDK_ROOT}" -type f -name sdkmanager | head -n 1)"
              if [ -z "${SDKMANAGER}" ]; then
                echo "sdkmanager was not found under ${SDK_ROOT}"
                exit 1
              fi
              echo "Using sdkmanager: ${SDKMANAGER}"
              yes | "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --licenses >/dev/null || true
              "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" "platforms;android-36" "build-tools;35.0.0"
            '

      - name: Build unsigned APK and App Bundle
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -v "${BUBBLEWRAP_VOLUME}:/root/.bubblewrap" \
            -w "/work/${TWA_DIR}" \
            "${BUBBLEWRAP_IMAGE}" \
            build \
            --skipSigning \
            --skipPwaValidation \
            --manifest="/work/${TWA_DIR}/twa-manifest.json"

      - name: Collect build artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="$(find "${TWA_DIR}" -type f -name '*.apk' | head -n 1 || true)"
          AAB="$(find "${TWA_DIR}" -type f -name '*.aab' | head -n 1 || true)"
          test -n "${APK}" || { echo "No APK found."; exit 1; }
          test -n "${AAB}" || { echo "No AAB found."; exit 1; }
          cp "${APK}" dist/OpenCompany-unsigned.apk
          cp "${AAB}" dist/OpenCompany-unsigned.aab
          cp "${TWA_DIR}/twa-manifest.json" dist/twa-manifest.json

      - name: Upload TWA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencompany-twa-unsigned
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Clean up Bubblewrap SDK volume
        if: always()
        shell: bash
        run: docker volume rm "${BUBBLEWRAP_VOLUME}" >/dev/null 2>&1 || true
