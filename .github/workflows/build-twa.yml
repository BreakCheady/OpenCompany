name: Build OpenCompany TWA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "manifest.webmanifest"
      - "icon-192.png"
      - "icon-512.png"
      - "icon-maskable-512.png"
      - "service-worker.js"
      - "offline.html"
      - ".github/workflows/build-twa.yml"
      - ".github/scripts/configure-twa.mjs"

permissions:
  contents: read

jobs:
  build-twa:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TWA_DIR: twa-build
      TWA_PACKAGE_ID: com.opencompany.game
      TWA_APP_NAME: OpenCompany
      TWA_LAUNCHER_NAME: OpenCompany
      TWA_HOST: opencompanygame.com
      TWA_START_URL: /
      TWA_VERSION_NAME: 1.0.0
      TWA_VERSION_CODE: "1"
      TWA_ASSET_VERSION: 0.10.160
      BUBBLEWRAP_IMAGE: ghcr.io/googlechromelabs/bubblewrap:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check live PWA manifest and icons
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST_URL="https://${TWA_HOST}/manifest.webmanifest?v=${TWA_ASSET_VERSION}"
          ICON_URL="https://${TWA_HOST}/icon-512.png?v=${TWA_ASSET_VERSION}"
          MASKABLE_URL="https://${TWA_HOST}/icon-maskable-512.png?v=${TWA_ASSET_VERSION}"

          echo "Checking ${MANIFEST_URL}"
          curl --fail --silent --show-error --location "${MANIFEST_URL}" -o /tmp/manifest.webmanifest
          node -e "JSON.parse(require('fs').readFileSync('/tmp/manifest.webmanifest','utf8')); console.log('Live manifest JSON: OK')"

          echo "Checking ${ICON_URL}"
          curl --fail --silent --show-error --location --output /dev/null "${ICON_URL}"

          echo "Checking ${MASKABLE_URL}"
          curl --fail --silent --show-error --location --output /dev/null "${MASKABLE_URL}"

          echo "Live PWA assets: OK"

      - name: Prepare TWA manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${TWA_DIR}" dist
          mkdir -p "${TWA_DIR}"
          node .github/scripts/configure-twa.mjs "${TWA_DIR}/twa-manifest.json"

          echo "Generated TWA manifest:"
          cat "${TWA_DIR}/twa-manifest.json"

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm             -v "${GITHUB_WORKSPACE}:/work"             -w "/work/${TWA_DIR}"             "${BUBBLEWRAP_IMAGE}"             update             --skipVersionUpgrade             --manifest="/work/${TWA_DIR}/twa-manifest.json"

      - name: Build unsigned APK and App Bundle
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm             -v "${GITHUB_WORKSPACE}:/work"             -w "/work/${TWA_DIR}"             "${BUBBLEWRAP_IMAGE}"             build             --skipSigning             --skipPwaValidation             --manifest="/work/${TWA_DIR}/twa-manifest.json"

      - name: Collect build artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          echo "Searching for generated APK/AAB files..."
          find "${TWA_DIR}" -type f \( -name '*.apk' -o -name '*.aab' \) -print

          APK="$(find "${TWA_DIR}" -type f -name '*.apk' | head -n 1 || true)"
          AAB="$(find "${TWA_DIR}" -type f -name '*.aab' | head -n 1 || true)"

          if [ -z "${APK}" ]; then
            echo "No APK found."
            exit 1
          fi

          if [ -z "${AAB}" ]; then
            echo "No App Bundle (.aab) found."
            exit 1
          fi

          cp "${APK}" dist/OpenCompany-unsigned.apk
          cp "${AAB}" dist/OpenCompany-unsigned.aab
          cp "${TWA_DIR}/twa-manifest.json" dist/twa-manifest.json

          echo "Artifacts:"
          ls -lh dist

      - name: Upload TWA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencompany-twa-unsigned
          path: dist/
          if-no-files-found: error
          retention-days: 14
