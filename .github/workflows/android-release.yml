name: Android signed release
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android-release.yml'
permissions:
  contents: write
concurrency:
  group: opencompany-android-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.OC_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.OC_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OC_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OC_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || {
            echo "::error::Permanent release signing secrets are not configured."
            exit 1
          }
      - name: Build signed APK and Play Store bundle
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.OC_RELEASE_KEYSTORE_B64 }}
          OC_RELEASE_STORE_PASSWORD: ${{ secrets.OC_RELEASE_STORE_PASSWORD }}
          OC_RELEASE_KEY_ALIAS: ${{ secrets.OC_RELEASE_KEY_ALIAS }}
          OC_RELEASE_KEY_PASSWORD: ${{ secrets.OC_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          TEMP_KEYSTORE="$(mktemp "${RUNNER_TEMP}/opencompany-release-XXXXXX.jks")"
          trap 'rm -f "$TEMP_KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$TEMP_KEYSTORE"
          echo "::add-mask::$TEMP_KEYSTORE"
          export OC_RELEASE_KEYSTORE_FILE="$TEMP_KEYSTORE"
          gradle --no-daemon :app:assembleRelease :app:bundleRelease :app:lintRelease
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk | grep -E 'Verifies|certificate SHA-256 digest'
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/release/app-release.apk | grep '^package:'
      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenCompany-Signed-Release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

      - name: Prepare public update metadata
        if: github.ref == 'refs/heads/main'
        working-directory: android
        run: |
          set -euo pipefail
          VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*\\([0-9]*\\).*/\\1/p' app/build.gradle | head -1)"
          VERSION_NAME="$(sed -n "s/^[[:space:]]*versionName[[:space:]]*'\\([^']*\\)'.*/\\1/p" app/build.gradle | head -1)"
          test -n "$VERSION_CODE" && test -n "$VERSION_NAME"
          cp app/build/outputs/apk/release/app-release.apk "${RUNNER_TEMP}/OpenCompany.apk"
          printf '{"versionCode":%s,"versionName":"%s","apkUrl":"https://github.com/BreakCheady/OpenCompany/releases/download/android-latest/OpenCompany.apk"}\\n' "$VERSION_CODE" "$VERSION_NAME" > "${RUNNER_TEMP}/opencompany-update.json"
      - name: Publish latest Android APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view android-latest --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create android-latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "OpenCompany Android – aktueller Download" --notes "Automatisch veröffentlichte Android-App. APK herunterladen und die Installation auf Android bestätigen." --latest=false
          fi
          gh release upload android-latest "${RUNNER_TEMP}/OpenCompany.apk#OpenCompany.apk" "${RUNNER_TEMP}/opencompany-update.json#opencompany-update.json" --repo "$GITHUB_REPOSITORY" --clobber
