name: Enforce version bump

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  version-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify increment and synchronized asset versions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, subprocess, sys
          base_ref = "${{ github.event.pull_request.base.sha }}"
          current = pathlib.Path('index.html').read_text()
          previous = subprocess.check_output(['git','show',f'{base_ref}:index.html'],text=True)
          rx = re.compile(r'style\\.css\\?v=(\\d+)\\.(\\d+)\\.(\\d+)')
          old, new = rx.search(previous), rx.search(current)
          if not old or not new:
              sys.exit('Missing version marker in style.css asset URL')
          old_version, new_version = tuple(map(int,old.groups())), tuple(map(int,new.groups()))
          if new_version <= old_version:
              sys.exit(f'Every PR must increase the game version: {old_version} -> {new_version}')
          expected = '.'.join(map(str,new_version))
          for filename in ('index.html','service-worker.js','manifest.webmanifest'):
              data = pathlib.Path(filename).read_text()
              versions = set(re.findall(r'\\?v=(\\d+\\.\\d+\\.\\d+)',data))
              if versions != {expected}:
                  sys.exit(f'{filename} asset versions {versions!r} must all match {expected}')
          print(f'Game version successfully raised to {expected}')
          PY
