plugins { id 'com.android.application'; id 'com.google.gms.google-services' }
android {
  namespace 'com.opencompany.game'
  compileSdk 36
  defaultConfig {
    applicationId 'com.opencompany.game'
    minSdk 24
    targetSdk 35
    versionCode 10
    versionName '0.1.9'
  }
  buildFeatures { buildConfig true }
  // Release signing is enabled only when the operator supplies a permanent key.
  def releaseStoreFile = System.getenv('OC_RELEASE_KEYSTORE_FILE')
  def releaseStorePassword = System.getenv('OC_RELEASE_STORE_PASSWORD')
  def releaseKeyAlias = System.getenv('OC_RELEASE_KEY_ALIAS')
  def releaseKeyPassword = System.getenv('OC_RELEASE_KEY_PASSWORD')
  if ([releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it != null && !it.isEmpty() }) {
    signingConfigs {
      release {
        storeFile file(releaseStoreFile)
        storePassword releaseStorePassword
        keyAlias releaseKeyAlias
        keyPassword releaseKeyPassword
      }
    }
    buildTypes {
      release {
        signingConfig signingConfigs.release
        minifyEnabled false
      }
    }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}
dependencies {
  implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.6.2'
  implementation platform('com.google.firebase:firebase-bom:34.6.0')
  implementation 'com.google.firebase:firebase-messaging'
}
